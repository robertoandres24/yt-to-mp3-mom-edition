<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>YouTube MP3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">♫</div>
    <h1>YouTube MP3</h1>
    <p class="intro">Tu audio, guardado en tu equipo.</p>
    <form id="form">
      <label for="url">Enlace del video de YouTube</label>
      <input id="url" type="url" placeholder="Pega aquí el enlace de YouTube" required maxlength="2048" autocomplete="off" spellcheck="false">
      <div class="destination">
        <div><span class="caption">Guardar en</span><p id="folder">Buscando carpeta…</p><small id="destination-hint">Pendrive primero · Descargas como alternativa</small></div>
        <button id="choose" type="button" class="secondary">Cambiar</button>
      </div>
      <button id="download" type="submit" class="primary" disabled>Descargar MP3</button>
    </form>
    <section class="status" aria-live="polite" aria-atomic="true">
      <p id="message">Pega un enlace para comenzar.</p>
      <progress id="progress" max="100" value="0" hidden aria-label="Progreso de descarga"></progress>
      <p id="filename" class="filename"></p>
    </section>
    <div class="actions">
      <button id="cancel" type="button" class="secondary" hidden>Cancelar descarga</button>
      <button id="open" type="button" class="secondary" disabled>Abrir carpeta</button>
    </div>
    <footer>Utiliza esta aplicación solo con contenido que tengas derecho a descargar.</footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
